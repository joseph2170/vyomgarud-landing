<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>VyomGarud — UAV Systems</title>
    <script type="text/javascript">
      // Single Page App (SPA) routing fix for GitHub Pages
      var path = window.location.pathname;
      var search = window.location.search;
      var hash = window.location.hash;
      
      // Redirect to index.html with the original path as a parameter
      if (path !== '/vyomgarud-landing/' && path !== '/vyomgarud-landing/index.html') {
        var newPath = '/vyomgarud-landing/';
        if (path || search || hash) {
          newPath += '#/' + path.replace('/vyomgarud-landing/', '') + search + hash;
        }
        window.location.replace(newPath);
      }
    </script>
  </head>
  <body>
    <noscript>
      <p>Please enable JavaScript to view this page.</p>
    </noscript>
  </body>
</html>
